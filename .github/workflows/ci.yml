name: CI

# Linux and Docker run on every push. Windows and macOS cost more runner
# minutes, so they only run when started by hand (Actions tab -> CI -> Run
# workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Also run Windows and macOS"
        type: boolean
        default: true
      arm64_native:
        description: "Also run the native Linux arm64 job (needs an arm64 runner)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the footprint audit reads the whole history
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Tests with aiohttp's pure-Python parser
        run: AIOHTTP_NO_EXTENSIONS=1 python -m pytest -q tests/test_flood.py tests/test_public_proxy.py tests/test_compat.py
      - name: Footprint audit
        run: python scripts/audit-footprints

  browser:
    # Headless Chromium against the real dashboard. Dev/CI only: playwright is
    # never a runtime dependency.
    name: Dashboard in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[e2e]"
          python -m playwright install --with-deps chromium
      - name: Browser tests
        env:
          TR4P_E2E_SHOTS: ${{ runner.temp }}/shots
        run: python -m pytest -q tests/e2e
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  distros:
    # The quickstart on bare distro images, as an ordinary user, in a venv.
    name: Distro / ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:22.04", "ubuntu:24.04", "fedora:41", "alpine:3.21"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Quickstart in ${{ matrix.image }}
        run: docker run --rm -v "$PWD:/src:ro" ${{ matrix.image }} sh /src/scripts/distro-check.sh

  multiarch:
    name: Docker image / linux/arm64 (emulated)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and start
        run: |
          docker buildx build --platform linux/arm64 --load -t tr4p:arm64 .
          docker run --rm --platform linux/arm64 --entrypoint tr4p tr4p:arm64 --version
          docker run --rm --platform linux/arm64 --entrypoint python tr4p:arm64 -c "import platform, aiohttp; print(platform.machine(), aiohttp.__version__)"

  arm64-native:
    name: Linux arm64 native / Python 3.12
    if: github.event_name == 'workflow_dispatch' && inputs.arm64_native
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

  old-python:
    # The system Python on current macOS is older than we support: it must
    # say so plainly instead of failing with a traceback.
    name: Old Python message / macOS
    if: github.event_name == 'workflow_dispatch' && inputs.full_matrix
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System python3 explains itself
        run: |
          /usr/bin/python3 --version
          if /usr/bin/python3 -c "import sys; sys.exit(0 if sys.version_info < (3, 10) else 1)"; then
            out=$(PYTHONPATH=src /usr/bin/python3 -m tr4p 2>&1 || true)
            echo "$out"
            echo "$out" | grep -q "needs Python 3.10 or newer"
          else
            echo "system python3 is already 3.10 or newer; nothing to check here"
          fi
      - name: Homebrew Python quickstart
        run: |
          brew --prefix >/dev/null
          "$(brew --prefix)/bin/python3" -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet .
          "$RUNNER_TEMP/venv/bin/tr4p" init --yes --mode standalone
          "$RUNNER_TEMP/venv/bin/tr4p" doctor

  quickstart:
    # Runs the commands from the README quickstart, as written, on a clean
    # runner, then walks the canary -> trapped -> decoy path.
    name: Quickstart / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Linux always; Windows and macOS only on a manual full run.
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.full_matrix) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Quickstart commands
        run: |
          pip install .
          tr4p init --yes --mode standalone
          tr4p doctor
          tr4p run &
          python scripts/smoke http://127.0.0.1:8080

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and start
        run: docker compose up -d --build --wait
      - name: Smoke flow (canary -> trapped -> decoy)
        run: python3 scripts/smoke http://127.0.0.1:8080
      - name: Decoy cannot open an outbound connection
        run: |
          if docker compose exec -T decoy python -c "import socket; socket.create_connection(('example.com', 80), 5)"; then
            echo "the decoy reached the outside world" && exit 1
          fi
          docker compose exec -T main python -c "import urllib.request as u; assert u.urlopen('http://decoy:8081/__control/ping', timeout=3).status == 204"
      - name: Decoy cannot use the dashboard
        run: |
          docker compose exec -T decoy python -c "
          import urllib.request as u, urllib.error as e
          try:
              u.urlopen('http://main:8787/api/v1/state', timeout=3)
          except e.HTTPError as err:
              assert err.code == 403, err.code
          else:
              raise SystemExit('the decoy reached the dashboard')
          "
      - name: Containers are locked down
        run: |
          for name in main decoy; do
            id=$(docker compose ps -q $name)
            test "$(docker inspect -f '{{.Config.User}}' $id)" = "10001:10001"
            test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' $id)" = "true"
            test "$(docker inspect -f '{{.HostConfig.CapDrop}}' $id)" = "[ALL]"
          done
          test "$(docker inspect -f '{{.HostConfig.PortBindings}}' $(docker compose ps -q decoy))" = "map[]"
          docker inspect -f '{{json .HostConfig.PortBindings}}' $(docker compose ps -q main) | grep -q '"8787/tcp":\[{"HostIp":"127.0.0.1"'
          docker compose exec -T main tr4p doctor
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 60

  cross-platform:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    if: github.event_name == 'workflow_dispatch' && inputs.full_matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Footprint audit
        run: python scripts/audit-footprints
